openapi: 3.0.3
info:
  title: API de Gestión Hotelera (PMS) - UAS FIM
  version: 2.4.0
  description: >-
    Especificación canónica y formal OpenAPI 3.0.3 del Sistema de Gestión Hotelera
    (Property Management System) con soporte de Controles de Hipermedios HATEOAS
    (Richardson Nivel 3 / RFC 8288), políticas de versionado y cabeceras de obsolescencia (RFC 8594).
  contact:
    name: Dr. Herman Geovany Ayala Zúñiga
    email: hayala@uas.edu.mx
servers:
  - url: http://localhost:3000
    description: Servidor Local de Desarrollo
  - url: https://api-pms.uas.edu.mx
    description: Servidor de Producción / Staging

paths:
  /api/v1/auth/login:
    post:
      summary: Autenticación de usuario y generación de token Bearer JWT
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Petición incorrecta o malformada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/rooms:
    get:
      summary: Catálogo de Habitaciones con Controles HATEOAS y Paginación
      tags:
        - Habitaciones
      parameters:
        - name: page
          in: query
          description: Número de página para navegación
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Cantidad de registros por página
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista paginada de habitaciones con affordances HATEOAS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRooms'
        '400':
          description: Parámetros de paginación inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Crear nueva habitación
      tags:
        - Habitaciones
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '201':
          description: Habitación registrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          description: Error de validación en la estructura de la habitación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado - Token Bearer JWT faltante o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Prohibido - Privilegios insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Entidad no procesable - Violación de reglas de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/rooms/{id}:
    get:
      summary: Obtener detalle de habitación con affordances dinámicos por estado
      tags:
        - Habitaciones
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de habitación con enlaces HATEOAS condicionales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Habitación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/rooms/{id}/checkout:
    post:
      summary: Realizar check-out de habitación ocupada
      tags:
        - Habitaciones
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Check-out completado exitosamente, transición a AVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          description: Estado inválido para realizar check-out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/rooms/{id}/finish-maintenance:
    post:
      summary: Finalizar mantenimiento de habitación y retornar a disponible
      tags:
        - Habitaciones
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mantenimiento concluido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bookings:
    get:
      summary: Consultar lista de reservas con hipermedios
      tags:
        - Reservas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Colección de reservas con affordances de navegación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Crear una nueva reserva para una habitación AVAILABLE
      tags:
        - Reservas
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '201':
          description: Reserva creada en estado CONFIRMED con enlaces cancel y process_payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Habitación no disponible para reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bookings/{id}:
    get:
      summary: Obtener estado de reserva con affordances dinámicos
      tags:
        - Reservas
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Reserva no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Cancelar reserva (Disponible únicamente en estado CONFIRMED)
      tags:
        - Reservas
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reserva cancelada, los enlaces de acción desaparecen dinámicamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: No se puede cancelar una reserva no confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bookings/{id}/payments:
    post:
      summary: Procesar pago de reserva (Disponible únicamente en estado CONFIRMED)
      tags:
        - Reservas
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pago procesado exitosamente y transición a COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: La reserva no permite pagos en su estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/guests:
    get:
      summary: Consultar catálogo de huéspedes registrados
      tags:
        - Huéspedes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de huéspedes con hipermedios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guest'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Registrar nuevo huésped
      tags:
        - Huéspedes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestInput'
      responses:
        '201':
          description: Huésped registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guest'
        '400':
          description: Parámetros requeridos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/guests/{id}:
    get:
      summary: Obtener detalle de huésped por ID
      tags:
        - Huéspedes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Información del huésped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guest'
        '404':
          description: Huésped no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v2/rooms:
    get:
      summary: Versión 2 de Habitaciones (Evolución de contrato sin rotura)
      description: >-
        Retorna la estructura de habitaciones evolucionada con precios desglosados en moneda base,
        tasa de impuestos (IVA) y total final, compatible con clientes v2.
      tags:
        - Habitaciones (v2)
      responses:
        '200':
          description: Catálogo v2 con desglose de moneda e impuestos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomV2'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ingrese el token JWT Bearer obtenido en /api/v1/auth/login para acceder a rutas protegidas.

  schemas:
    LoginInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          example: usr-101
        username:
          type: string
          example: admin
        email:
          type: string
          format: email
          example: admin@pms.uas.edu.mx
        role:
          type: string
          example: ADMINISTRADOR

    RoomInput:
      type: object
      required:
        - room_number
        - type
        - price_per_night
        - capacity
      properties:
        room_number:
          type: string
          example: '101'
        type:
          type: string
          enum: [STANDARD, SUITE, DELUXE]
          example: SUITE
        price_per_night:
          type: number
          minimum: 1
          example: 1250.50
        capacity:
          type: integer
          minimum: 1
          maximum: 10
          example: 3
        status:
          type: string
          enum: [AVAILABLE, OCCUPIED, MAINTENANCE]
          default: AVAILABLE
          example: AVAILABLE

    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-0001-4000-8000-000000000001
        room_number:
          type: string
          example: '101'
        type:
          type: string
          example: SUITE
        price_per_night:
          type: number
          example: 1250.50
        capacity:
          type: integer
          example: 3
        status:
          type: string
          enum: [AVAILABLE, OCCUPIED, MAINTENANCE]
          example: AVAILABLE
        _links:
          type: object
          description: Controles de hipermedios HATEOAS (JSON HAL / RFC 8288)
          properties:
            self:
              type: object
              properties:
                href: { type: string, example: '/api/v1/rooms/a1b2c3d4-0001-4000-8000-000000000001' }
                method: { type: string, example: 'GET' }
            book:
              type: object
              properties:
                href: { type: string, example: '/api/v1/bookings' }
                method: { type: string, example: 'POST' }
            checkout:
              type: object
              properties:
                href: { type: string, example: '/api/v1/rooms/a1b2c3d4-0001-4000-8000-000000000001/checkout' }
                method: { type: string, example: 'POST' }

    RoomV2:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-0001-4000-8000-000000000001
        room_number:
          type: string
          example: '101'
        type:
          type: string
          example: SUITE
        pricing:
          type: object
          properties:
            currency: { type: string, example: 'MXN' }
            base_price: { type: number, example: 1250.50 }
            tax_rate: { type: number, example: 0.16 }
            total_price: { type: number, example: 1450.58 }
        capacity:
          type: integer
          example: 3
        status:
          type: string
          example: AVAILABLE
        _links:
          type: object

    PaginatedRooms:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
        total_items: { type: integer, example: 25 }
        total_pages: { type: integer, example: 3 }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        _links:
          type: object
          properties:
            self: { type: object, properties: { href: { type: string, example: '/api/v1/rooms?page=1&limit=10' } } }
            first: { type: object, properties: { href: { type: string, example: '/api/v1/rooms?page=1&limit=10' } } }
            prev: { type: object, properties: { href: { type: string, example: null } } }
            next: { type: object, properties: { href: { type: string, example: '/api/v1/rooms?page=2&limit=10' } } }
            last: { type: object, properties: { href: { type: string, example: '/api/v1/rooms?page=3&limit=10' } } }

    BookingInput:
      type: object
      required:
        - room_id
        - guest_name
        - check_in
        - check_out
      properties:
        room_id:
          type: string
          format: uuid
          example: a1b2c3d4-0001-4000-8000-000000000001
        guest_name:
          type: string
          example: Carlos Mendoza
        check_in:
          type: string
          format: date
          example: '2026-11-01'
        check_out:
          type: string
          format: date
          example: '2026-11-05'

    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: b8c3d2e1-1111-4000-8000-000000000001
        room_id:
          type: string
          format: uuid
        guest_name:
          type: string
        check_in:
          type: string
        check_out:
          type: string
        status:
          type: string
          enum: [CONFIRMED, CANCELLED, COMPLETED]
          example: CONFIRMED
        _links:
          type: object
          properties:
            self:
              type: object
              properties:
                href: { type: string }
                method: { type: string }
            cancel:
              type: object
              properties:
                href: { type: string }
                method: { type: string, example: 'DELETE' }
            process_payment:
              type: object
              properties:
                href: { type: string }
                method: { type: string, example: 'POST' }

    GuestInput:
      type: object
      required:
        - full_name
        - email
        - document_id
      properties:
        full_name:
          type: string
          example: María Elena González
        email:
          type: string
          format: email
          example: maria.gonzalez@example.com
        document_id:
          type: string
          example: INE-9876543210
        phone:
          type: string
          example: '+52 669 987 6543'

    Guest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
        document_id:
          type: string
        phone:
          type: string
        _links:
          type: object
          properties:
            self:
              type: object
              properties:
                href: { type: string }
            bookings:
              type: object
              properties:
                href: { type: string }

    ErrorResponse:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          example: https://example.com/probs/validation-error
        title:
          type: string
          example: Petición inválida
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: El parámetro proporcionado no cumple con el esquema requerido.
        instance:
          type: string
          example: /api/v1/rooms
